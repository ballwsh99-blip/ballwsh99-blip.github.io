<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1B4B72">
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icon-192.png">
<title>دفتر الديون</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#EEF2F5;--surface:#FFFFFF;--ink:#13263B;--muted:#5C6E80;--line:#D3DCE4;--rule:#E4EBF1;
  --debt:#B03030;--debt-bg:#FBECEC;--pay:#0C7757;--pay-bg:#E3F4ED;
  --debt-solid:#B03030;--pay-solid:#0C7757;--primary:#1B4B72;--on-primary:#FFFFFF;
  --backdrop:rgba(10,25,40,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1822;--surface:#16242F;--ink:#E8EEF3;--muted:#93A4B5;--line:#26394A;--rule:#1F3040;
    --debt:#F28B8B;--debt-bg:#3A1F25;--pay:#52CDA4;--pay-bg:#143229;
    --primary:#6BB0E4;--on-primary:#0E1822;--backdrop:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1822;--surface:#16242F;--ink:#E8EEF3;--muted:#93A4B5;--line:#26394A;--rule:#1F3040;
  --debt:#F28B8B;--debt-bg:#3A1F25;--pay:#52CDA4;--pay-bg:#143229;
  --primary:#6BB0E4;--on-primary:#0E1822;--backdrop:rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;font-size:16px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 150px}
h1{font-size:26px;font-weight:800;margin:0}
h2{font-size:18px;font-weight:700;margin:22px 0 10px}
.sub{color:var(--muted);font-size:14px;margin:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}

/* ledger summary: double underline like an accounting total */
.ledger{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 16px 2px}
.lhead,.lrow{display:grid;grid-template-columns:1fr minmax(90px,auto) minmax(90px,auto);gap:12px;align-items:baseline}
.lhead{color:var(--muted);font-size:13px;padding:8px 0 6px;border-bottom:1px solid var(--line)}
.lrow{padding:10px 0;border-bottom:1px solid var(--rule)}
.lrow:last-child{border-bottom:3px double var(--ink)}
.lrow .cur{font-weight:600}
.lrow .num{font-weight:700;text-align:end;font-variant-numeric:tabular-nums}
.lrow .num.zero{color:var(--muted);font-weight:400}
.hint{color:var(--muted);text-align:center;padding:18px 8px}

.banner{background:var(--debt-bg);border:1px solid var(--debt);color:var(--ink);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:14px}
.banner.info{background:var(--surface);border-color:var(--line)}

.search{margin:16px 0 8px}
input,select,textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 12px;font-size:16px}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
.err{color:var(--debt);font-size:14px;min-height:20px;margin-top:6px}

.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.crow{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:none;border:0;border-bottom:1px solid var(--rule);text-align:start}
.crow:last-child{border-bottom:0}
.crow:active{background:var(--bg)}
.crow .nm{font-weight:700}
.crow .ph{font-size:13px;color:var(--muted)}
.crow .bl{text-align:end;display:flex;flex-direction:column;gap:2px;font-weight:700;font-variant-numeric:tabular-nums}
.owe{color:var(--debt)}.credit{color:var(--pay)}.clear{color:var(--muted);font-weight:400}

.btn{min-height:48px;border-radius:12px;border:0;font-weight:700;padding:0 16px;background:var(--surface);border:1px solid var(--line)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.debt{background:var(--debt-solid);color:#fff;border-color:var(--debt-solid)}
.btn.pay{background:var(--pay-solid);color:#fff;border-color:var(--pay-solid)}
.btn.danger{color:var(--debt);border-color:var(--debt)}
.btn.sm{min-height:42px;font-size:14px;padding:0 10px;font-weight:600}
.btn[disabled]{opacity:.5}
.row{display:grid;gap:10px}.row.c2{grid-template-columns:1fr 1fr}.row.c4{grid-template-columns:repeat(4,1fr)}
.row+.row{margin-top:10px}

.fab{position:fixed;inset-inline-end:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));box-shadow:0 6px 20px rgba(10,25,40,.3);border-radius:999px;min-height:52px;padding:0 22px;z-index:20}

.nav{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:30}
.nav-in{display:flex;width:100%;max-width:560px}
.nav button{flex:1;background:none;border:0;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:13px;font-weight:600}
.nav button.on{color:var(--primary)}

.back{background:none;border:0;color:var(--primary);font-weight:700;padding:6px 0;min-height:44px}
.bigbal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:8px 0 14px}
.bigbal .line{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--rule)}
.bigbal .line:last-child{border-bottom:3px double var(--ink)}
.bigbal .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.tx{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--rule)}
.tx:last-child{border-bottom:0}
.tx .dot{width:10px;height:10px;border-radius:50%}
.dot.debt{background:var(--debt)}.dot.pay{background:var(--pay)}
.tx small{display:block;color:var(--muted);font-size:13px}
.tx .amt{font-weight:700;font-variant-numeric:tabular-nums}
.x{background:none;border:0;color:var(--muted);font-size:22px;min-width:40px;min-height:40px}

.set{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 16px 16px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600}
.seg button.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.chk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);margin:0;font-weight:400}
.chk input{width:22px;min-height:22px;height:22px}

.backdrop{position:fixed;inset:0;background:var(--backdrop);z-index:50}
.sheet{position:fixed;inset-inline:0;bottom:0;margin:0 auto;max-width:560px;max-height:90vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));z-index:60;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 6px;font-size:20px}
.toast{position:fixed;inset-inline:0;bottom:calc(90px + env(safe-area-inset-bottom,0px));margin:0 auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:90;font-size:15px;font-weight:600}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
.ob{max-width:420px;width:100%}
.ob h1{font-size:30px;line-height:1.35;margin-bottom:10px}
.ob p{color:var(--muted);font-size:17px}
.dots{display:flex;gap:8px;margin:22px 0}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--primary);width:26px;border-radius:9px}
.pin{display:flex;gap:14px;justify-content:center;margin:20px 0}
.pin i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.pin i.on{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px;justify-content:center;direction:ltr}
.pad button{height:64px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:24px;font-weight:700}
.stmt table{width:100%;border-collapse:collapse;font-size:15px}
.stmt th,.stmt td{padding:6px 4px;border-bottom:1px solid var(--rule);text-align:start}
.stmt td.n{text-align:end;font-variant-numeric:tabular-nums}
.pre{white-space:pre-wrap;word-break:break-word;font-size:13px}
.iline{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;background:var(--bg)}
.iqp{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;align-items:center;margin-top:8px}
.iqp input{min-width:0}
.ltot{font-weight:700;font-size:14px;min-width:56px;text-align:end;font-variant-numeric:tabular-nums}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sug:empty{display:none}
.sug button{border:1px solid var(--primary);color:var(--primary);background:var(--surface);border-radius:999px;min-height:38px;padding:0 14px;font-weight:600;font-size:15px}
.wa-btn{background:#128C4A;color:#fff;border-color:#128C4A}
.ic{vertical-align:middle;margin-inline-end:6px}
.pay-chip{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--pay-bg);border:1px solid var(--pay);border-radius:12px;padding:8px 12px;margin:10px 0;font-size:15px}
.pay-chip .btns{display:flex;gap:8px}
.txmain{background:none;border:0;padding:0;text-align:start;width:100%}
.minor{color:var(--muted);font-size:14px;margin:4px 0}
.inv-head{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px;font-size:15px}
.inv-head div{background:var(--bg);border-radius:10px;padding:8px 10px}
.inv-head small{display:block;color:var(--muted);font-size:12px}
.stmt tr.sub td{font-size:13px;color:var(--muted);padding-top:0}
.stmt tfoot td{border-bottom:3px double var(--ink);padding-top:10px}
@media print{
  body *{visibility:hidden}
  .printable,.printable *{visibility:visible}
  .printable{position:absolute;inset:0 0 auto 0;padding:16px;color:#000;background:#fff}
}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
</style>
</head>

{n:"جيبوتي",cc:"253",cur:"DJF"},{n:"جزر القمر",cc:"269",cur:"KMF"}
];

var $=function(s){return document.querySelector(s);};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});};
var r3=function(x){return Math.round(x*1000)/1000;};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);};
var pad=function(n){return (n<10?"0":"")+n;};
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function fmtDate(s){return s?s.split("-").reverse().join("/"):"";}

/* ---------- storage ---------- */
var storageOk=true;
function fresh(){return {v:1,customers:[],tx:[],customCurs:[],items:[],s:{onboarded:false,country:"",cc:"",defCur:"USD",active:["USD"],digits:"en",theme:"auto",pin:"",msg:DEFAULT_MSG,lastBackup:0,shop:"",sham:"",shamName:"",invSeq:0}};}
function normalize(d){
  var f=fresh();
  d=d||{};
  var o={v:1,customers:Array.isArray(d.customers)?d.customers:[],tx:Array.isArray(d.tx)?d.tx:[],customCurs:Array.isArray(d.customCurs)?d.customCurs:[],items:Array.isArray(d.items)?d.items:[],s:Object.assign({},f.s,d.s||{})};
  if(!o.s.msg||o.s.msg===OLD_MSG)o.s.msg=DEFAULT_MSG;
  if(!Array.isArray(o.s.active)||!o.s.active.length)o.s.active=[o.s.defCur||"USD"];
  if(o.s.active.indexOf(o.s.defCur)<0)o.s.active.unshift(o.s.defCur);
  return o;
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r)return normalize(JSON.parse(r));}catch(e){storageOk=false;}
  return fresh();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOk=false;}}
var S=load();
var UI={view:"home",cid:null,q:"",rp:"month"};
var pendingConfirm=null;

/* ---------- helpers ---------- */
function allCurs(){return CURRENCIES.map(function(x){return {c:x.c,n:x.n,s:x.s};}).concat(S.customCurs.map(function(x){return {c:x.c,n:x.n,s:x.s};}));}
function curInfo(code){return allCurs().filter(function(x){return x.c===code;})[0]||{c:code,n:code,s:code};}
function activeCurs(){return S.s.active.map(curInfo);}
function cust(id){return S.customers.filter(function(c){return c.id===id;})[0];}
function normDigits(s){return String(s||"").replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d);}).replace(/[۰-۹]/g,function(d){return "۰۱۲۳۴۵۶۷۸۹".indexOf(d);});}
function parseAmt(str){
  var s=normDigits(str).replace(/[\s٬]/g,"").replace(/٫/g,".");
  if(s.indexOf(".")<0&&/,\d{1,3}$/.test(s)&&(s.match(/,/g)||[]).length===1&&/,\d{1,2}$/.test(s))s=s.replace(",",".");
  s=s.replace(/,/g,"");
  var n=parseFloat(s);
  return isFinite(n)?n:NaN;
}
function fmtNum(n){return Math.abs(n).toLocaleString("en-US",{maximumFractionDigits:3});}
function fmtAmt(n,cur){return fmtNum(n)+" "+curInfo(cur).s;}
function bal(cid){
  var b={};
  S.tx.forEach(function(t){if(t.cid!==cid)return;b[t.cur]=(b[t.cur]||0)+(t.type==="debt"?t.amount:-t.amount);});
  Object.keys(b).forEach(function(k){b[k]=r3(b[k]);if(b[k]===0)delete b[k];});
  return b;
}
function balHtml(b){
  var k=Object.keys(b);
  if(!k.length)return '<span class="clear">مسدّد</span>';
  return k.map(function(c){return b[c]>0?'<span class="owe">عليه '+esc(fmtAmt(b[c],c))+'</span>':'<span class="credit">له '+esc(fmtAmt(b[c],c))+'</span>';}).join("");
}
function totals(){
  var t={};
  S.customers.forEach(function(c){var b=bal(c.id);Object.keys(b).forEach(function(k){t[k]=t[k]||{me:0,you:0};if(b[k]>0)t[k].me+=b[k];else t[k].you+=-b[k];});});

}

function localize(root){

  var map="٠١٢٣٤٥٦٧٨٩";
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),n,list=[];
  while((n=w.nextNode())){var p=n.parentNode&&n.parentNode.nodeName;if(p==="TEXTAREA"||p==="SCRIPT"||p==="STYLE")continue;list.push(n);}
  list.forEach(function(t){t.nodeValue=t.nodeValue.replace(/[0-9]/g,function(d){return map[+d];});});
}

async function copyText(txt){

  catch(e){
    var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();

function itemNames(){

}

function saveTx(type){
  var a=parseAmt($("#f_amt").value);

  var cur=$("#f_cur").value;
  var tx={id:uid(),cid:UI.cid,cur:cur,amount:r3(a),type:type,note:$("#f_note").value.trim(),date:$("#f_date").value||today(),ts:Date.now()};
  if(type==="debt"){
    var items=[];

      var n=l.n.trim(),p=parseAmt(l.p),q=parseAmt(l.q);
      if(!(p>0))p=0;
      if(!(q>0))q=1;
      if(!n&&!p)return;
      items.push({n:n||"مادة",q:q,p:p});
      if(n)learnItem(n,cur,p);
    });

function cc(){return S.s.cc||"";}
function waPhone(c){
  var p=normDigits(c.phone||"").replace(/[^\d+]/g,"");
  if(p.charAt(0)==="+")p=p.slice(1);
  else if(p.indexOf("00")===0)p=p.slice(2);
  else if(p.charAt(0)==="0"&&cc())p=cc()+p.slice(1);
  else if(cc()&&p.length<=10&&p.indexOf(cc())!==0)p=cc()+p;
  return p;
}
function waTo(c,text){return "https://wa.me/"+waPhone(c)+"?text="+encodeURIComponent(text);}
function shopName(){return S.s.shop||"المحل";}
function payLine(){

function owedText(c){

function lockKey(k){
  if(k==="⌫")lockBuf=lockBuf.slice(0,-1);else if(lockBuf.length<4)lockBuf+=k;

    if(hp(lockBuf)===S.s.pin){lockBuf="";$("#overlay").innerHTML="";if(!S.s.onboarded){OB=0;showOnboarding();}}

      if(fi)fi.focus();
      break;}
    case "call":{var c2=cust(UI.cid);if(!c2.phone){toast("أضف رقم هاتف للزبون أولاً");break;}openUrl("tel:"+normDigits(c2.phone).replace(/[^\d+]/g,""));break;}
    case "statement":statementSheet(cust(UI.cid));break;
    case "stcopy":{var c3=cust(id),txt=statementText(c3);
      if(navigator.share){navigator.share({title:"كشف حساب "+c3.name,text:txt}).catch(function(){});}
      else copyText(txt).then(function(ok){toast(ok?"تم النسخ":"تعذر النسخ");});
      break;}
    case "print":window.print();break;
    case "rp":UI.rp=v;render();break;
    case "digits":S.s.digits=v;save();render();break;
    case "theme":S.s.theme=v;save();applyTheme();render();break;
    case "curs":cursSheet();break;
    case "addcur":{var n=$("#f_cn").value.trim(),sy=$("#f_cs").value.trim();if(!n||!sy){setErr("اكتب الاسم والرمز");break;}var code="X"+uid();S.customCurs.push({c:code,n:n,s:sy});S.s.active.push(code);save();cursSheet();render();toast("تمت إضافة العملة");break;}
    case "backup":backupSheet();break;
    case "bkcopy":copyText($("#f_bk").value).then(function(ok){if(ok){markBackup();toast("تم نسخ النسخة الاحتياطية");}else toast("تعذر النسخ، حدّد النص وانسخه يدوياً");});break;
    case "bkshare":{var data=$("#f_bk").value;
      try{
        var f=new File([data],"dafter-backup.json",{type:"application/json"});
        if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:"نسخة دفتر الديون"}).then(markBackup).catch(function(){});break;}
      }catch(_){}
      if(navigator.share){navigator.share({title:"نسخة دفتر الديون",text:data}).then(markBackup).catch(function(){});}
      else copyText(data).then(function(ok){if(ok)markBackup();toast(ok?"تم النسخ":"تعذر النسخ");});
      break;}
    case "restore":restoreSheet();break;
    case "rsgo":{
      var raw=$("#f_rs").value.trim(),obj;
      try{obj=JSON.parse(raw);}catch(_){setErr("النص غير صالح");break;}
      var d=obj&&obj.data?obj.data:obj;
      if(!d||!Array.isArray(d.customers)||!Array.isArray(d.tx)){setErr("هذه ليست نسخة دفتر ديون صحيحة");break;}
      confirmSheet("سيتم استبدال كل البيانات الحالية بالنسخة المستعادة. متابعة؟","استعادة",function(){var keepPin=S.s.pin;S=normalize(d);S.s.pin=keepPin;S.s.onboarded=true;save();applyTheme();closeSheet();go("home");toast("تمت الاستعادة");});
      break;}
    case "pin":pinSheet();break;
    case "pinsave":{var p=normDigits($("#f_pin").value);if(!/^\d{4}$/.test(p)){setErr("اكتب 4 أرقام");break;}S.s.pin=hp(p);save();closeSheet();render();toast("تم تفعيل القفل");break;}
    case "pinoff":S.s.pin="";save();closeSheet();render();toast("تم إلغاء القفل");break;
    case "wipe":confirmSheet("سيتم حذف كل الزبائن والعمليات والإعدادات نهائياً. هل أنت متأكد؟","احذف كل شيء",function(){S=fresh();save();applyTheme();closeSheet();OB=0;go("home");showOnboarding();});break;
    case "confirmyes":{var fn=pendingConfirm;pendingConfirm=null;if(fn)fn();break;}
    case "obnext":if(OB<2){OB++;showOnboarding();}else obFinish();break;
    case "lk":lockKey(t.getAttribute("data-k"));break;
  }
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="q"){UI.q=t.value;var l=$("#list");l.innerHTML=listHtml();localize(l);return;}
  if(!INV)return;
  var i=parseInt(t.getAttribute("data-i"),10);
  if(isNaN(i)||!INV.lines[i])return;
  var ln=INV.lines[i];
  if(t.classList.contains("in_n")){
    ln.n=t.value;showSug(i);
    var cu=$("#f_cur")?$("#f_cur").value:S.s.defCur,pr=itemPrice(ln.n,cu);
    if(pr&&!String(ln.p).trim()){ln.p=String(pr);var pe=document.querySelector('.in_p[data-i="'+i+'"]');if(pe)pe.value=ln.p;}
    recalcInv();
  }else if(t.classList.contains("in_q")){ln.q=t.value;recalcInv();}
  else if(t.classList.contains("in_p")){ln.p=t.value;recalcInv();}
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="f_file"&&t.files&&t.files[0]){var rd=new FileReader();rd.onload=function(){var ta=$("#f_rs");if(ta)ta.value=String(rd.result||"");};rd.readAsText(t.files[0]);return;}
  if(t.hasAttribute("data-cur")){
    var c=t.getAttribute("data-cur"),i=S.s.active.indexOf(c);
    if(t.checked&&i<0)S.s.active.push(c);
    if(!t.checked&&i>=0)S.s.active.splice(i,1);
    save();render();return;
  }
  var k=t.getAttribute("data-set");
  if(!k)return;
  if(k==="country"){var co=COUNTRIES.filter(function(x){return x.cc===t.value;})[0];S.s.cc=t.value;S.s.country=co?co.n:"";}
  else if(k==="defCur"){S.s.defCur=t.value;if(S.s.active.indexOf(t.value)<0)S.s.active.push(t.value);}
  else if(k==="msg"){S.s.msg=t.value.trim()||DEFAULT_MSG;}
  else if(k==="shop"||k==="shamName"){S.s[k]=t.value.trim();}
  else if(k==="sham"){S.s.sham=normDigits(t.value).trim();}
  save();toast("تم الحفظ");
});

/* ---------- start ---------- */
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
applyTheme();
render();
if(S.s.pin){showLock();}
else if(!S.s.onboarded){showOnboarding();}
</script>
</body>
</html>
